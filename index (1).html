<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face Invaders</title>
<style>
:root{--bg:#0e1030;--ink:#f4efe6;--hot:#ff6b5e;--mint:#5ee6b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1030;--ink:#f4efe6}}
:root[data-theme="dark"]{--bg:#0e1030;--ink:#f4efe6}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;font-weight:700}
header span{white-space:nowrap}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;text-align:center;padding:20px;overflow:auto;background:rgba(14,16,48,.82)}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#mu{white-space:nowrap}
@media (max-height:520px){#ov>p:not(#msg){display:none}#ov h1{font-size:24px}}
#ov h1{margin:0;font-size:clamp(28px,7vw,48px);letter-spacing:.5px}
#ov p{margin:0;max-width:34ch;line-height:1.45;opacity:.85}
button,label.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--hot);color:#2a0a07}
label.btn{background:var(--mint);color:#06281d}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--ink);outline-offset:3px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<header><span id="sc">Score 0</span><span>Face Invaders</span><span id="lv">Lives 3</span><button id="mu" style="padding:6px 12px">Music on</button></header>
<div id="wrap">
<canvas id="c"></canvas>
<div id="ov">
<h1 id="ttl">Shoot your friend’s face</h1>
<p>Move your finger or mouse to steer. The ship fires by itself. Don’t let the faces reach the bottom.</p>
<div class="row">
<button id="play">Play</button>
<input id="file" type="file" accept="image/*" hidden><input id="song" type="file" hidden>
</div>
<p id="msg">Tap Play and steer with your finger or mouse.</p>
</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),sc=document.getElementById('sc'),lv=document.getElementById('lv'),msg=document.getElementById('msg');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

function placeholder(skin,hair){
  const o=document.createElement('canvas');o.width=o.height=96;const g=o.getContext('2d');
  g.fillStyle=hair;g.beginPath();g.arc(48,40,44,Math.PI,0);g.fill();
  g.fillStyle=skin;g.beginPath();g.arc(48,52,40,0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(33,46,9,0,7);g.arc(63,46,9,0,7);g.fill();
  g.fillStyle='#222';g.beginPath();g.arc(35,48,4,0,7);g.arc(61,48,4,0,7);g.fill();
  g.strokeStyle='#222';g.lineWidth=4;g.lineCap='round';g.beginPath();g.arc(48,64,16,.15*Math.PI,.85*Math.PI);g.stroke();
  return o;
}

(function(){const im=new Image();im.onload=()=>{const o=document.createElement('canvas');o.width=o.height=96;o.getContext('2d').drawImage(im,0,0,96,96);faces=[o];};im.src=FACE;})();

document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{
    const o=document.createElement('canvas');o.width=o.height=96;const g=o.getContext('2d');
    const s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
    g.beginPath();g.arc(48,48,46,0,7);g.clip();g.drawImage(img,sx,sy,s,s,0,0,96,96);
    faces=[o];URL.revokeObjectURL(url);msg.textContent='Photo loaded. Press Play demo.';
  };
  img.onerror=()=>{msg.textContent='Could not read that image. Try another photo.';};
  img.src=url;
});

let ship,bullets,enemies,parts,eb=[],score,lives,over,tShot,tSpawn,last,running=false,targetX;
function reset(){ship={x:W/2,y:H-60};targetX=W/2;bullets=[];enemies=[];parts=[];eb=[];score=0;lives=3;over=false;tShot=0;tSpawn=0;upd();}
function upd(){sc.textContent='Score '+score;lv.textContent='Lives '+lives;}
function move(x){const r=cv.getBoundingClientRect();targetX=Math.max(24,Math.min(W-24,x-r.left));}
addEventListener('pointermove',e=>move(e.clientX));
addEventListener('pointerdown',e=>move(e.clientX));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')targetX=Math.max(24,targetX-60);if(e.key==='ArrowRight')targetX=Math.min(W-24,targetX+60);});

document.getElementById('play').onclick=()=>{ov.style.display='none';if(musOn)startMusic();reset();bannerT=2.8;tSpawn=2.5;running=true;last=performance.now();requestAnimationFrame(loop);};
cv.addEventListener('click',()=>{if(over){reset();over=false;running=true;last=performance.now();requestAnimationFrame(loop);}});

const stars=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.4}));
function burst(x,y){for(let i=0;i<12;i++){const a=Math.random()*6.28,v=60+Math.random()*140;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.5,c:Math.random()<.5?'#ff6b5e':'#5ee6b8'});}}

function loop(now){
  if(!running)return;
  const dt=Math.min((now-last)/1000,.05);last=now;if(bannerT>0)bannerT-=dt;
  ship.x+=(targetX-ship.x)*Math.min(1,dt*12);
  tShot-=dt;if(tShot<=0&&!over){bullets.push({x:ship.x,y:ship.y-22,vx:0});tShot=.22;}
  tSpawn-=dt;if(tSpawn<=0&&!over){enemies.push({x:40+Math.random()*(W-80),y:-40,ph:Math.random()*6,ft:1.2+Math.random()*2,f:faces[Math.floor(Math.random()*faces.length)],hp:1});tSpawn=Math.max(.45,1.1-score*.006);}
  const sp=70+Math.min(score,80)*1.6;
  bullets.forEach(b=>{b.y-=520*dt;b.x+=b.vx*dt;});bullets=bullets.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  enemies.forEach(e=>{e.y+=sp*dt;e.x+=Math.sin(now/500+e.ph)*40*dt;});
  enemies.forEach(e=>{e.ft-=dt;if(e.ft<=0&&e.y>0&&!over){const dx=ship.x-e.x,dy=ship.y-e.y,d=Math.hypot(dx,dy)||1;eb.push({x:e.x,y:e.y+24,vx:dx/d*150,vy:Math.max(dy/d,.5)*240});e.ft=1.6+Math.random()*2;}});
  eb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(!over&&Math.hypot(b.x-ship.x,b.y-ship.y)<18){b.dead=true;burst(ship.x,ship.y);lives--;upd();if(lives<=0)over=true;}});
  eb=eb.filter(b=>!b.dead&&b.y<H+20&&b.x>-20&&b.x<W+20);
  for(const b of bullets){for(const e of enemies){if(!e.dead&&!b.dead&&Math.hypot(b.x-e.x,b.y-e.y)<30){e.dead=b.dead=true;score++;burst(e.x,e.y);upd();}}}
  bullets=bullets.filter(b=>!b.dead);
  enemies.forEach(e=>{if(!e.dead&&e.y>H+30){e.dead=true;lives--;upd();if(lives<=0)over=true;}});
  enemies=enemies.filter(e=>!e.dead);
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;});parts=parts.filter(p=>p.t>0);
  draw(now);
  requestAnimationFrame(loop);
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f4efe6';
  stars.forEach(s=>{ctx.globalAlpha=.5;ctx.fillRect(s.x*W,((s.y*H+now*.02*s.s)%H),s.s,s.s);});
  ctx.globalAlpha=1;
  enemies.forEach(e=>ctx.drawImage(e.f,e.x-28,e.y-28,56,56));
  ctx.fillStyle='#ffd23f';eb.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill();});
  ctx.fillStyle='#5ee6b8';bullets.forEach(b=>ctx.fillRect(b.x-2,b.y-10,4,14));
  parts.forEach(p=>{ctx.globalAlpha=p.t*2;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);});
  ctx.globalAlpha=1;
  const s=ship;ctx.fillStyle='#ff6b5e';ctx.beginPath();ctx.moveTo(s.x,s.y-24);ctx.lineTo(s.x+20,s.y+18);ctx.lineTo(s.x,s.y+8);ctx.lineTo(s.x-20,s.y+18);ctx.closePath();ctx.fill();
  ctx.fillStyle='#5ee6b8';ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill();
  if(bannerT>0){const a=Math.min(1,bannerT*2,(2.8-bannerT)*4);ctx.globalAlpha=a;ctx.fillStyle='#ff6b5e';ctx.textAlign='center';const fs=Math.min(48,W/10);ctx.font='900 '+fs+'px "Trebuchet MS",sans-serif';ctx.fillText('THIS REVENGE',W/2,H/2-fs*.1);ctx.fillText('AGAINST YOU',W/2,H/2+fs*1.1);ctx.globalAlpha=1;}

songEl.loop=true;songEl.volume=.85;
function startSynth(){
  if(songEl){songEl.play().catch(()=>{});return;}
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  if(seqT)return;
  const n=[220,261.6,329.6,392,329.6,261.6,196,246.9,293.7,392,293.7,246.9];let i=0;
  seqT=setInterval(()=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=n[i%n.length]*(i%24<12?1:1.5);g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.2);i++;},220);
}
let ytF=null,ytOk=false,ytT=null;
addEventListener('message',e=>{if(/youtube/.test(e.origin))ytOk=true;});
function startMusic(){
  startSynth();return;
  ytOk=false;
  ytF=document.createElement('iframe');
  ytF.allow='autoplay';
  ytF.style.cssText='position:fixed;left:-400px;bottom:0;width:200px;height:200px;border:0;pointer-events:none';
  ytF.src='https://www.youtube-nocookie.com/embed/zyI7mwJKSmU?autoplay=1&loop=1&playlist=zyI7mwJKSmU&enablejsapi=1&playsinline=1';
  ytF.onload=()=>{try{ytF.contentWindow.postMessage(JSON.stringify({event:'listening',id:1}),'*');}catch(_){}};
  document.body.appendChild(ytF);
  ytT=setTimeout(()=>{if(!ytOk&&musOn)startSynth();},4000);
}
function stopMusic(){clearTimeout(ytT);if(ytF){ytF.remove();ytF=null;}if(songEl)songEl.pause();if(seqT){clearInterval(seqT);seqT=null;}}
document.getElementById('mu').onclick=function(){musOn=!musOn;this.textContent=musOn?'Music on':'Music off';if(musOn)startMusic();else stopMusic();};
document.getElementById('song').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  stopMusic();songEl=new Audio(URL.createObjectURL(f));songEl.loop=true;songEl.volume=.7;
  msg.textContent='Song loaded. Press Play demo.';if(running&&musOn)startMusic();
});
reset();draw(0);
